name: Android Build

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAMERA_VERSION_CODE: ${{ github.run_number }}
      CAMERA_VERSION_NAME: "0.2.0-phase02.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build signed debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :camera-core:testDebugUnitTest :aurora-core:testDebugUnitTest

      - name: Prepare OTA payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase/01-foundation-discovery'
        shell: bash
        run: |
          mkdir -p ota
          cp app/build/outputs/apk/debug/app-debug.apk ota/Camera-Phase01-latest.apk
          APK_SHA256=$(sha256sum ota/Camera-Phase01-latest.apk | awk '{print $1}')
          cat > ota/update.json <<EOF
          {
            "schemaVersion": 1,
            "packageName": "com.sahid.camera",
            "versionCode": ${CAMERA_VERSION_CODE},
            "versionName": "${CAMERA_VERSION_NAME}",
            "apkUrl": "https://github.com/sahid-code404/Camera-Computaional/releases/download/phase01-latest/Camera-Phase01-latest.apk",
            "sha256": "${APK_SHA256}",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          cat ota/update.json

      - name: Publish Phase 01 OTA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase/01-foundation-discovery'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f phase01-latest "$GITHUB_SHA"
          git push origin --force refs/tags/phase01-latest

          if ! gh release view phase01-latest >/dev/null 2>&1; then
            gh release create phase01-latest \
              --prerelease \
              --title "Camera Phase 01 OTA" \
              --notes "Automated signed development build for com.sahid.camera. Not a production release."
          fi

          gh release upload phase01-latest \
            ota/Camera-Phase01-latest.apk \
            ota/update.json \
            --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera-phase02-single-raw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
